spring.application.name=backend

# ============================================================
# Server Port (Spring Boot runs on port 8081)
# ============================================================
server.port=${PORT:8081}

# ============================================================
# MySQL Database Connection Settings
# ============================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vibesync_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

# OpenWeather API key stays on the backend; never add it to React
weather.api.key=${WEATHER_API_KEY:}

# ============================================================
# JPA / Hibernate Settings
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# JWT Configuration
# Must be at least 256 bits (32 characters) for HS256
# ============================================================
jwt.secret=${JWT_SECRET:VibeSync_SuperSecret_JWT_Key_2026_MustBe32CharsLong!}
jwt.expiration=86400000

# Vercel production URL and localhost development URL, comma-separated if needed
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ============================================================
# Gemini AI API Key (used in Phase 7)
# ============================================================
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.8-flash}

# ============================================================
# Spring Security - Disable default login page for REST API
# ============================================================
spring.security.user.name=disabled
